<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 440" role="img"><title>Water tracking app strategic brainstorm mindmap</title><desc>A central node for a water tracking app for busy adults, with five branches: core jobs, friction points, feature ideas ranked by effort and impact, monetization tradeoffs, and retention risks. Each branch has two leaves, and one monetization leaf flags a strategic tension.</desc>
<path d="M180 218C190 218 190 63 200 63M180 218C190 218 190 143 200 143M180 218C190 218 190 223 200 223M180 218C190 218 190 303 200 303M180 218C190 218 190 383 200 383" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<path d="M350 63H375M375 45V81M375 45H400M375 81H400M350 143H375M375 125V161M375 125H400M375 161H400M350 223H375M375 205V241M375 205H400M375 241H400M350 303H375M375 285V321M375 285H400M375 321H400M350 383H375M375 365V401M375 365H400M375 401H400" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="30" y="188" width="150" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="105" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Water tracking</text>
<rect x="200" y="43" width="150" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="275" y="63" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Core jobs</text>
<rect x="200" y="123" width="150" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="275" y="143" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Friction</text>
<rect x="200" y="203" width="150" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="275" y="223" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Feature ideas</text>
<rect x="200" y="283" width="150" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="275" y="303" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Monetization</text>
<rect x="200" y="363" width="150" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="275" y="383" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Retention risks</text>
<rect x="400" y="30" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="412" y="45" dominant-baseline="central" font-size="12" fill="#444441">Remember to drink at the right time</text>
<rect x="400" y="66" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="412" y="81" dominant-baseline="central" font-size="12" fill="#444441">See if I'm on track in one glance</text>
<rect x="400" y="110" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="412" y="125" dominant-baseline="central" font-size="12" fill="#444441">Forgetting: no cue when it matters</text>
<rect x="400" y="146" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="412" y="161" dominant-baseline="central" font-size="12" fill="#444441">Logging feels like a chore</text>
<rect x="400" y="190" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="412" y="205" dominant-baseline="central" font-size="12" fill="#444441">One-tap log from home screen (low effort, high impact)</text>
<rect x="400" y="226" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="412" y="241" dominant-baseline="central" font-size="12" fill="#444441">Wearable sync (high effort, modest gain)</text>
<rect x="400" y="270" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="412" y="285" dominant-baseline="central" font-size="12" fill="#444441">Subscription: steady recurring revenue</text>
<rect x="400" y="306" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="412" y="321" dominant-baseline="central" font-size="12" fill="#444441">Tension: paywall vs. habit formation</text>
<rect x="400" y="350" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="412" y="365" dominant-baseline="central" font-size="12" fill="#444441">Novelty fades by week three</text>
<rect x="400" y="386" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="412" y="401" dominant-baseline="central" font-size="12" fill="#444441">Alert fatigue leads to uninstall</text>
</svg>
